<div class="container">
  <h2>Articles</h2>

  <ul>
    <li *ngFor="let article of articles">
      <h3>{{article.title}}</h3>
      <p>{{article.content}}</p>
    </li>
  </ul>

  <h2>Créer un article</h2>
  <label>Titre</label>
  <input [(ngModel)]="newArticle.title" />
  
  <label>Contenu</label>
  <textarea [(ngModel)]="newArticle.content"></textarea>
  
  <button (click)="createArticle()">Créer</button>
</div>
